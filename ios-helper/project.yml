name: HealthSyncHelper
options:
  bundleIdPrefix: tw.lifehelper
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  HealthSyncHelper:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - HealthKit
      - Identity
      - Models
      - Networking
      - Storage
    info:
      path: Configuration/Info.plist
    entitlements:
      path: Configuration/HealthSyncHelper.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.lifehelper.healthsync
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - HealthSyncHelperTests
  HealthSyncHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HealthSyncHelper

