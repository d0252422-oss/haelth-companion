name: Algorithm runtime gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "health_companion_algorithms/**"
      - "fixtures/algorithm-golden/**"
      - "scripts/*algorithm-runtime*"
      - "scripts/python-algorithm-worker.py"
      - "tests/*algorithm*"
      - "tests_python/test_algorithm*"
      - "config/algorithm-runtime.policy.json"
      - "requirements-algorithm-ci.txt"
      - ".github/workflows/algorithm-runtime-gate.yml"

permissions:
  contents: read

jobs:
  parity-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALGORITHM_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded algorithm test dependencies
        run: |
          python -m pip install --requirement requirements-algorithm-ci.txt
          python -m pip install --no-deps --editable .
      - name: JavaScript golden, adapter, persistent worker, and fault gates
        run: >-
          node --test
          tests/algorithm-golden-parity.test.cjs
          tests/algorithm-runtime-adapter.test.cjs
          tests/persistent-algorithm-runtime.test.cjs
          tests/algorithm-runtime-policy.test.cjs
      - name: Python golden and transport gates
        run: >-
          python -m pytest -q
          tests_python/test_algorithm_golden_parity.py
          tests_python/test_algorithm_runtime_transport.py
      - name: Python static gates
        run: |
          python -m ruff check health_companion_algorithms tests_python/test_algorithm_golden_parity.py tests_python/test_algorithm_runtime_transport.py scripts/python-algorithm-runtime.py scripts/python-algorithm-worker.py
          python -m mypy health_companion_algorithms scripts/python-algorithm-runtime.py scripts/python-algorithm-worker.py
