name: Android beta APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-helper/**"
      - ".github/workflows/android-beta-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEALTH_COMPANION_BETA_API_BASE_URL: https://uavimjgccigpbwqmfkhh.supabase.co/functions/v1/mobile-health-beta
      HEALTH_COMPANION_BETA_SUPABASE_URL: https://uavimjgccigpbwqmfkhh.supabase.co
      HEALTH_COMPANION_BETA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HEALTH_COMPANION_BETA_SUPABASE_PUBLISHABLE_KEY }}
      HEALTH_COMPANION_GOOGLE_WEB_CLIENT_ID: ${{ vars.HEALTH_COMPANION_GOOGLE_WEB_CLIENT_ID }}
      HEALTH_COMPANION_WEB_AUTH_API_URL: https://script.google.com/macros/s/AKfycbwc9OBZtGgFiXk2n1_bquNZqkFkX9OzgAxlh7rljySrvNiF6ywsxEpBzNv5V4onRv5h/exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit test and assemble development-signed beta APK
        working-directory: android-helper
        run: |
          test -n "$HEALTH_COMPANION_BETA_SUPABASE_PUBLISHABLE_KEY"
          test -n "$HEALTH_COMPANION_GOOGLE_WEB_CLIENT_ID"
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Record APK checksum
        run: sha256sum android-helper/app/build/outputs/apk/debug/app-debug.apk | tee android-helper/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: health-sync-companion-beta-debug
          path: |
            android-helper/app/build/outputs/apk/debug/app-debug.apk
            android-helper/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error
