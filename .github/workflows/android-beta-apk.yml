name: Android beta APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-helper/**"
      - ".github/workflows/android-beta-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit test and assemble development-signed beta APK
        working-directory: android-helper
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Record APK checksum
        run: sha256sum android-helper/app/build/outputs/apk/debug/app-debug.apk | tee android-helper/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: health-sync-companion-beta-debug
          path: |
            android-helper/app/build/outputs/apk/debug/app-debug.apk
            android-helper/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error
