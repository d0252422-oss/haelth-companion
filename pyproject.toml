[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "health-companion-algorithm-environment"
version = "0.0.0"
description = "Development environment for Health Companion algorithm engines."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]
packages = ["health_companion_algorithms"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests_python"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["health_companion_algorithms"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
